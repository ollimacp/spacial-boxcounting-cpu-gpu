name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Check for PyPI token
      run: |
        if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
          echo "ERROR: PYPI_API_TOKEN secret is not set."
          echo "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions/new"
          echo "The secret must be named PYPI_API_TOKEN with a valid PyPI API token."
          exit 1
        fi

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel
        python -m build

    - name: Publish to PyPI
      run: twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}